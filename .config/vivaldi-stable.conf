# User override: keep Vivaldi 8.2's OSCryptAsync off the xdg-desktop-portal
# Secret key provider, and on the classic gnome-keyring path instead.
#
# --password-store=... does NOT control this on this build (verified by
# testing every value against the real binary) -- the portal provider wins
# unconditionally whenever it succeeds. And once the portal was made to work
# (see hyprland-portals.conf), it turned out to retrieve a DIFFERENT secret
# than the pre-existing "Chrome Safe Storage" gnome-keyring item that
# actually encrypted this profile's saved logins/cookies -- Vivaldi's own
# vivaldi_keystore_checker.cc correctly detects this mismatch and refuses to
# proceed ("Encrypted keystore changed or is now unavailable"), which is the
# error dialog this was chasing in the first place.
#
# Disabling this feature keeps OSCryptAsync on the classic
# FreedesktopSecretKeyProvider, which talks directly to gnome-keyring's
# org.freedesktop.secrets and reuses the original, matching key. Verified by
# copying Local State + Cookies/Login Data/Web Data from the real profile
# into a scratch --user-data-dir: with this flag, no keystore-mismatch error;
# without it, the error reproduces every time. See SETUP.md step 12.
--disable-features=SecretPortalKeyProviderUseForEncryption
