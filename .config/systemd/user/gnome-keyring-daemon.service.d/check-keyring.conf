# Validate/repair the blank-password keyring file before every daemon start
# (boot, crash restarts, manual restarts), then unlock the real collection and
# re-assert the "default" alias right after. See SETUP.md step 13.
[Service]
ExecStartPre=-%h/.local/bin/check-default-keyring.py
ExecStartPost=-%h/.local/bin/unlock-default-keyring.sh
